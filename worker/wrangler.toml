name = "ask-uwe"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

rules = [{ type = "Text", globs = ["**/*.md"], fallthrough = true }]

# 10 questions per minute per visitor IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://djui.github.io,http://localhost:4173"
